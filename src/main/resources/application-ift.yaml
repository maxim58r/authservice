server:
  port: 8080

spring:
  application:
    name: authservice

  datasource:
    url: ${IFT_DATASOURCE_URL}
    username: ${IFT_DATASOURCE_USERNAME}
    password: ${IFT_DATASOURCE_PASSWORD}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  elasticsearch:
    uris: ${ELASTICSEARCH_URI}
    username: ${ELASTICSEARCH_USERNAME}
    password: ${ELASTICSEARCH_PASSWORD}

  security:
    user:
      name: admin
      # password: admin

redis:
  host: ${IFT_REDIS_HOST}
  port: ${IFT_REDIS_PORT}
  connect-timeout: 60000
  password: ${IFT_REDIS_PASSWORD}

embedded-redis:
  enabled: false

logging:
  level:
    root: INFO
    org.springframework: DEBUG
#  logstash:
#    host: ${ELASTIC_HOST:"192.168.1.35:30429"} # Адрес вашего Elasticsearch.
#    port: 9200

jwt:
  secret: secret_key
  expiration: 3600000

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  prometheus:
    metrics:
      export:
        enabled: true
