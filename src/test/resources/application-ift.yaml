server:
  port: 8080

spring:
  application:
    name: authservice

  datasource:
    url: jdbc:postgresql://192.168.1.35:32172/postgres_auth
    username: postgres
    password: postgres
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    user:
      name: admin
      # Uncomment and set a secure password if required:
      # password: my-secure-password

redis:
  host: 192.168.1.35
  port: 31015
  connect-timeout: 60000
  password: "CfAb11y5gLQ3quvc"

embedded-redis:
  enabled: false

logging:
  level:
    org.springframework.boot.context.properties: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: secret_key
  expiration: 3600000 # in milliseconds (1 hour)

management:
  endpoint:
    health:
      probes:
        enabled: true