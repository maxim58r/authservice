server:
  port: 8080

spring:
  application:
    name: authservice

  datasource:
    # Если переменной IFT_DATASOURCE_URL нет, берётся дефолт (локальный IP и порт).
    url: ${IFT_DATASOURCE_URL:jdbc:postgresql://192.168.1.35:32172/postgres_auth}
    username: ${IFT_DATASOURCE_USERNAME:postgres}
    password: ${IFT_DATASOURCE_PASSWORD:postgres}

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate.dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    user:
      name: admin
      # Если хотите, можно оставить password здесь
      # password: admin

redis:
  # Аналогично: если не задали IFT_REDIS_HOST, то берётся локальное 192.168.1.35
  host: ${IFT_REDIS_HOST:192.168.1.35}
  port: ${IFT_REDIS_PORT:31015}
  connect-timeout: 60000
  password: ${IFT_REDIS_PASSWORD:CfAb11y5gLQ3quvc}

embedded-redis:
  enabled: false

logging:
  level:
    org.springframework.boot.context.properties: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

jwt:
  secret: secret_key
  expiration: 3600000 # 1 час

management:
  endpoint:
    health:
      probes:
        enabled: true
